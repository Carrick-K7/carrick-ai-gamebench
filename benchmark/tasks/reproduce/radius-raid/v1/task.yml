  - { id: start-controls, category: mechanics, points: 10, case: start-controls }
  - { id: shooting, category: mechanics, points: 10, case: shooting }
  - { id: enemy-variety, category: mechanics, points: 12, case: enemy-variety }
  - { id: powerup, category: mechanics, points: 8, case: powerup }
  - { id: damage-score, category: mechanics, points: 5, case: damage-score }
  - { id: movement-feel, category: feel, points: 10, case: movement-feel }
  - { id: fire-cadence, category: feel, points: 10, case: fire-cadence }
  - { id: visual-menu, category: visual, points: 10, case: visual-menu }
  - { id: visual-combat, category: visual, points: 10, case: visual-combat }
  - { id: pause, category: stability, points: 5, case: pause }
  - { id: restart-cleanup, category: stability, points: 5, case: restart-cleanup }
