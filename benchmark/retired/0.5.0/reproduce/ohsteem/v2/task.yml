  - { id: cell-cycle, category: mechanics, points: 10, case: cell-cycle }
  - { id: no-three, category: mechanics, points: 10, case: no-three }
  - { id: balanced-colors, category: mechanics, points: 10, case: balanced-colors }
  - { id: unique-lines, category: mechanics, points: 10, case: unique-lines }
  - { id: completion, category: mechanics, points: 5, case: completion }
  - { id: input-feedback, category: feel, points: 10, case: input-feedback }
  - { id: size-reset, category: feel, points: 10, case: size-reset }
  - { id: visual-home, category: visual, points: 10, case: visual-home }
  - { id: visual-board, category: visual, points: 10, case: visual-board }
  - { id: deterministic-puzzle, category: stability, points: 2.5, case: deterministic-puzzle }
  - { id: locked-cell, category: stability, points: 2.5, case: locked-cell }
  - { id: run-seed, category: stability, points: 5, case: run-seed }
