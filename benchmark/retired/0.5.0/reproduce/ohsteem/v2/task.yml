starter: vite-ts
budget_seconds: 3600
network_policy: model-api-only
runtime:
  node: "22"
  package_manager: pnpm
  port: 4173
  viewport: [1280, 720]
  device_scale_factor: 1
test_suite: tests/cases.json
bridge:
  version: "1"
  state_schema: state.schema.json
reference:
