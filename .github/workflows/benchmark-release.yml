name: Benchmark release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @carrick/gamebench exec playwright install --with-deps chromium
      - name: Match tag, package, and release lock
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const version = JSON.parse(fs.readFileSync("package.json")).version;
            if (`v${version}` !== process.env.GITHUB_REF_NAME) {
              throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match package ${version}`);
            }
            const lock = JSON.parse(fs.readFileSync(`benchmark/releases/${version}.json`));
            if (lock.benchmark_version !== version) {
              throw new Error(`release lock ${lock.benchmark_version} does not match ${version}`);
            }
          '
      - run: pnpm check
      - name: Create immutable release evidence
        run: |
          version="${GITHUB_REF_NAME#v}"
          install -d release-artifacts
          cp "benchmark/releases/${version}.json" \
            "release-artifacts/gamebench-${version}-release-lock.json"
          if [ -f "docs/releases/${version}.md" ]; then
            cp "docs/releases/${version}.md" release-artifacts/release-summary.md
          else
            echo "# GameBench ${GITHUB_REF_NAME}" > release-artifacts/release-summary.md
          fi
          {
            echo
            echo "## Release evidence"
            echo
            echo "- Git commit: \`$(git rev-parse HEAD)\`"
            echo "- Benchmark release lock: \`gamebench-${version}-release-lock.json\`"
            echo "- Workflow: one Agent invocation and one canonical evaluation per task"
          } >> release-artifacts/release-summary.md
          (
            cd release-artifacts
            sha256sum "gamebench-${version}-release-lock.json" release-summary.md > SHA256SUMS
          )
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A retry may verify existing evidence, never silently replace it.
            gh release download "$GITHUB_REF_NAME" --dir release-existing
            for artifact in release-artifacts/*; do
              cmp "$artifact" "release-existing/${artifact##*/}"
            done
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --latest \
              --title "GameBench $GITHUB_REF_NAME" \
              --notes-file release-artifacts/release-summary.md \
              release-artifacts/*
          fi
