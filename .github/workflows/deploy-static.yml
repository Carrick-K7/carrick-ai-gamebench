name: Deploy static site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @carrick/gamebench-site build
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.GAMEBENCH_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.GAMEBENCH_DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload immutable build
        env:
          DEPLOY_HOST: ${{ secrets.GAMEBENCH_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.GAMEBENCH_DEPLOY_USER }}
        run: |
          tar -C apps/site/dist -czf "/tmp/gamebench-${GITHUB_SHA}.tar.gz" .
          scp "/tmp/gamebench-${GITHUB_SHA}.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d /srv/gamebench/releases/$GITHUB_SHA/site && tar -xzf /tmp/gamebench-$GITHUB_SHA.tar.gz -C /srv/gamebench/releases/$GITHUB_SHA/site && ln -sfn /srv/gamebench/releases/$GITHUB_SHA /srv/gamebench/current"
