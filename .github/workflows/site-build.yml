name: Static site build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/site/**"
      - "packages/core/**"
      - "benchmark/tasks/**"
      - "benchmark/retired/**"
      - "benchmark/releases/**"
      - "results/**"
      - "infra/**"
      - ".github/workflows/site-build.yml"
  push:
    branches:
      - main
    paths:
      - "apps/site/**"
      - "packages/core/**"
      - "benchmark/tasks/**"
      - "benchmark/retired/**"
      - "benchmark/releases/**"
      - "results/**"
      - "infra/**"
      - ".github/workflows/site-build.yml"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm --filter @carrick/gamebench-core build
      - run: pnpm --filter @carrick/gamebench build
      - run: pnpm cagb check
      - name: Build static site
        env:
          GAMEBENCH_SITE_BUILD_ID: ${{ github.sha }}
        run: pnpm --filter @carrick/gamebench-site build
      - name: Bundle isolated play-origin landing page
        run: cp -R infra/play-root apps/site/dist/gamebench-play-root
      - name: Write immutable build manifest
        env:
          SITE_BUILD_ID: ${{ github.sha }}
          SITE_REF: ${{ github.ref }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const index = JSON.parse(fs.readFileSync("results/index.json"));
            const liteIndex = JSON.parse(fs.readFileSync("results/lite/index.json"));
            const releases = fs.readdirSync("benchmark/releases")
              .filter((file) => file.endsWith(".json"))
              .map((file) => JSON.parse(fs.readFileSync(`benchmark/releases/${file}`)).benchmark_version);
            const manifest = {
              schema_version: 1,
              site_build_id: process.env.SITE_BUILD_ID,
              source_ref: process.env.SITE_REF,
              benchmark_versions: releases,
              publication_ids: index.entries.map((entry) => entry.publication_id),
              lightweight_result_ids: liteIndex.results.map((entry) => entry.series_id),
            };
            fs.writeFileSync(
              "apps/site/dist/site-build.json",
              `${JSON.stringify(manifest, null, 2)}\n`,
            );
          '
      - name: Package immutable production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p release/site
          cp -R apps/site/dist/. release/site/
          tar -C release -czf gamebench-production.tar.gz .
          tar -tzf gamebench-production.tar.gz >/dev/null
      - name: Deploy through restricted SSH command
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $REVISION" < gamebench-production.tar.gz
      - name: Smoke test production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl --fail --silent --show-error https://gamebench.ai.carrick7.com/ --output /tmp/gamebench-index.html
      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
