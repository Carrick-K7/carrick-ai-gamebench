name: Published result validation

on:
  pull_request:
    paths:
      - "results/**"
      - "packages/core/**"
      - "packages/publisher/**"
      - "apps/site/**"
  push:
    branches:
      - main
    paths:
      - "results/**"

permissions:
  contents: read

jobs:
  validate-publications:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate schemas, non-empty object fixture, and package boundaries
        run: pnpm check
      - run: pnpm cagb verify-publication
